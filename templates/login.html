{% extends "base.html" %}
{% block title %}Sign in — AIS Canteen Pre-order{% endblock %}
{% block content %}
  <div class="card login-card">
    <h1>Sign in</h1>
    <p class="muted">Pre-order your canteen lunch. Staff and admins sign in here too.</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label>Username
        <input type="text" name="username" autocomplete="off" autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="off">
      </label>
      <button type="submit">Sign in</button>
    </form>
  </div>
{% endblock %}
